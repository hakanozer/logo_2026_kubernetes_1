apiVersion: batch/v1
kind: CronJob
metadata:
  name: training-heartbeat
  namespace: logo-ms
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 60
      template:
        metadata:
          labels:
            app: training-heartbeat
        spec:
          restartPolicy: OnFailure
          containers:
            - name: heartbeat
              image: busybox:1.36
              command: ["/bin/sh", "-c", "date -u; echo training cronjob completed"]
