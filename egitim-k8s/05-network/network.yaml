apiVersion: v1
kind: Service
metadata:
  name: elasticsearch-alias
  namespace: logo-ms
spec:
  type: ExternalName
  externalName: elasticsearch.logo-ms.svc.cluster.local
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-only-apps
  namespace: logo-ms
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - inventory-service
          - order-service
          - payment-service
          - notification-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: logo-ms
          podSelector:
            matchLabels:
              app: api-gateway
      ports:
        - protocol: TCP
          port: 8081
        - protocol: TCP
          port: 8082
        - protocol: TCP
          port: 8083
        - protocol: TCP
          port: 8084
