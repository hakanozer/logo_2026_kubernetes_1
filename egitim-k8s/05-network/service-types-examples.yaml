apiVersion: v1
kind: Service
metadata:
  name: api-gateway-nodeport-example
  namespace: logo-ms
spec:
  type: NodePort
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-loadbalancer-example
  namespace: logo-ms
spec:
  type: LoadBalancer
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
