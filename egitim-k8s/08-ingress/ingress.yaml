apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-gateway
  namespace: logo-ms
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - logo.local
      secretName: logo-local-tls
  rules:
    - host: logo.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
