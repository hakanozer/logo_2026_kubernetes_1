apiVersion: v1
kind: ServiceAccount
metadata:
  name: logo-reader
  namespace: logo-ms
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: logo-reader
  namespace: logo-ms
rules:
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: logo-reader
  namespace: logo-ms
subjects:
  - kind: ServiceAccount
    name: logo-reader
    namespace: logo-ms
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: logo-reader
