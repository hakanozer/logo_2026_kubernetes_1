apiVersion: v1
kind: Pod
metadata:
  name: restricted-context-check
  namespace: logo-ms
  labels:
    app: restricted-context-check
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: check
      image: busybox:1.36
      command: ["/bin/sh", "-c", "id; sleep 3600"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
