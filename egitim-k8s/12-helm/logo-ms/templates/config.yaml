{{- range $name, $service := .Values.services }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-config
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: logo-microservices
data:
{{- if $service.env }}
{{- range $key, $value := $service.env }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
{{- else }}
  TRAINING_SERVICE: {{ $name | quote }}
{{- end }}
---
{{- end }}
