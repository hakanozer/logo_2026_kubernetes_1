apiVersion: apps/v1
kind: Deployment
metadata:
  name: bad-image
  namespace: logo-ms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bad-image
  template:
    metadata:
      labels:
        app: bad-image
    spec:
      containers:
        - name: order-service
          image: logo/order-service:tag-does-not-exist
          imagePullPolicy: Always
