apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: logo-ms-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/hakanozer/logo_2026_kubernetes_1.git
    targetRevision: master
    path: egitim-k8s/12-helm/logo-ms
    helm:
      valueFiles:
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: logo-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
