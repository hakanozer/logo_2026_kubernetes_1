apiVersion: v1
kind: Namespace
metadata:
  name: logo-dev
  labels:
    environment: dev
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: logo-dev-quota
  namespace: logo-dev
spec:
  hard:
    pods: "20"
    requests.cpu: "2"
    requests.memory: 4Gi
---
